name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent duplicate runs: group by PR number for PR events, by ref for pushes.
# cancel-in-progress drops stale runs when new commits land on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Skip CI on PR merge commits — the PR check already validated this code.
    # Direct pushes (sync, bump) still run CI normally.
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'Merge pull request #')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore PKHeX.sln

      - name: Build
        run: dotnet build PKHeX.sln -c Release --no-restore

      - name: Test
        run: dotnet test PKHeX.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Validate Linux catalog metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          # Exercise production staging with a tiny executable; this validates
          # desktop/AppStream metadata without rebuilding the published payload.
          mkdir -p tmp/catalog-validation/publish
          printf '#!/bin/sh\nexit 0\n' > tmp/catalog-validation/publish/PKHeX.Avalonia
          chmod +x tmp/catalog-validation/publish/PKHeX.Avalonia
          VERSION=$(sed -n 's/.*<UIVersion>\(.*\)<\/UIVersion>.*/\1/p' Directory.Build.props)
          bash .github/scripts/prepare-appdir.sh tmp/catalog-validation/publish \
            tmp/catalog-validation/AppDir "$VERSION" "$(git rev-parse HEAD)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          retention-days: 14
